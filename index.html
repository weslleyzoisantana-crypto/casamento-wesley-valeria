<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wesley & Valéria</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

}

body{

font-family:'Cormorant Garamond',serif;

background:linear-gradient(180deg,#fffdf8,#f4ecdf);

<script>

const dataCasamento = new Date("2026-09-19T17:00:00");

function atualizarContagem(){

    const agora = new Date();

    const diferenca = dataCasamento - agora;

    if(diferenca <= 0){

        document.getElementById("count").innerHTML =

        "💖 Chegou o grande dia! 💖";

        return;

    }

    const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));

    const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

    const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));

    const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

    document.getElementById("count").innerHTML =

    ${dias} dias • ${horas}h ${minutos}m ${segundos}s;
