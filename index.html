<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Wesley & Valéria</title>
<style> /* =========================
   TEMA PREMIUM CASAMENTO
========================= */

@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f5ef;
    font-family:'Cormorant Garamond', serif;
    overflow-x:hidden;
}

/* Fundo Floral */

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 10% 10%, rgba(203,173,120,.15), transparent 18%),
    radial-gradient(circle at 90% 20%, rgba(198,170,130,.12), transparent 18%),
    radial-gradient(circle at 20% 90%, rgba(215,195,165,.15), transparent 18%),
    radial-gradient(circle at 90% 90%, rgba(194,168,122,.12), transparent 18%),
    linear-gradient(#fbfaf7,#f5efe5);
    z-index:-2;
}

/* Folhas decorativas */

body::after{
    content:"🌿";
    position:fixed;
    font-size:140px;
    opacity:.05;
    top:20px;
    right:30px;
    transform:rotate(20deg);
    z-index:-1;
}

/* Container */

.container{

    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* Envelope */

.envelope{

    width:340px;
    height:220px;

    position:relative;

    cursor:pointer;

    perspective:1200px;

}

/* Base */

.base{

    width:100%;
    height:100%;
    background:#f5ead8;

    position:absolute;

    border-radius:8px;

    box-shadow:
    0 30px 60px rgba(0,0,0,.15);

}

/* Tampa */

.flap{

    position:absolute;

    width:100%;
    height:120px;

    background:#e7d6bb;

    clip-path:polygon(0 0,100% 0,50% 100%);

    transform-origin:top;

    transition:1s;

    z-index:4;

}

/* Carta */

.letter{

    position:absolute;

    left:20px;

    top:20px;

    width:300px;

    height:180px;

    background:white;

    border-radius:6px;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    transition:1s;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    z-index:2;

}

.letter h1{

    font-family:'Great Vibes', cursive;

    font-size:50px;

    color:#9f7b43;

}

.letter p{

    margin-top:15px;

    color:#7b6b5d;

    font-size:20px;

}

/* Abrindo */

.envelope.open .flap{

    transform:rotateX(180deg);

}

.envelope.open .letter{

    transform:translateY(-170px);

}

/* Selo */

.seal{

    position:absolute;

    width:70px;

    height:70px;

    background:#b48b4d;

    border-radius:50%;

    left:50%;

    top:80px;

    transform:translateX(-50%);

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:28px;

    z-index:5;

    box-shadow:0 8px 20px rgba(0,0,0,.2);

    transition:.5s;

}

.envelope.open .seal{

    opacity:0;

    transform:translateX(-50%) scale(.3);

}

/* Brilho */

.envelope:hover{

    transform:translateY(-6px);

    transition:.4s;

}

/* Botão */

.btn-open{

    margin-top:40px;

    padding:15px 40px;

    border:none;

    background:#b48b4d;

    color:white;

    border-radius:40px;

    font-size:18px;

    cursor:pointer;

    letter-spacing:1px;

}

.btn-open:hover{

    background:#9d773d;

}
body{margin:0;font-family:Georgia,serif;background:#faf7f2;color:#5a4636;text-align:center}
.hero{padding:60px 20px;background:linear-gradient(#fff,#f3eadf)}
h1{font-size:48px;margin:0}h2{font-weight:normal}
.card{max-width:700px;margin:25px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
button,a.btn{display:inline-block;padding:14px 22px;border-radius:30px;background:#b9935a;color:#fff;text-decoration:none}
#count{font-size:30px;font-weight:bold}
</style></head><body>
<div class='hero'><h1>Wesley & Valéria</h1><h2>19 de setembro de 2026 • 17h</h2></div>
<div class='card'><h3>Faltam</h3><div id='count'></div></div>
<div class='card'><h3>Estamos nos casando! 💍</h3><p>Será uma alegria celebrar esse momento com você.</p>
<p><b>Local:</b><br>Rua Tereza Soares, 115 – Parque Genibaú</p></div>
<div class='card'><h3>Contribua com nossa Lua de Mel ✈️</h3>
<a class='btn' href='https://link.mercadopago.com.br/wesleyevaleria' target='_blank'>Contribuir</a></div>
<div class='card'><h3>Confirmação de Presença</h3>
<input placeholder='Seu nome'><br><br><button>Confirmar</button></div>
<script>
const t=new Date('2026-09-19T17:00:00');
function u(){let d=t-new Date();if(d<0){count.innerHTML='Chegou o grande dia!';return;}
let s=Math.floor(d/1000),dd=Math.floor(s/86400);s%=86400;
let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);let ss=s%60;
count.innerHTML=`${dd} dias ${h}h ${m}m ${ss}s`;}
setInterval(u,1000);u();
</script></body></html>
