<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wesley & Valéria</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#f8f5ef;
font-family:'Cormorant Garamond',serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
}

.envelope{
position:relative;
width:340px;
height:220px;
margin:auto;
cursor:pointer;
}

.base{
position:absolute;
width:100%;
height:100%;
background:#f5ead8;
border-radius:10px;
box-shadow:0 20px 40px rgba(0,0,0,.2);
  

.flap{
position:absolute;
width:100%;
height:120px;
background:#e7d6bb;
clip-path:polygon(0 0,100% 0,50% 100%);
transform-origin:top;
transition:1s;
z-index:3;
}

.letter{
position:absolute;
left:20px;
top:20px;
width:300px;
height:180px;
background:white;
border-radius:8px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
transition:1s;
z-index:2;
}

.letter h1{
font-family:'Great Vibes',cursive;
font-size:52px;
color:#b48b4d;
}

.letter p{
margin-top:10px;
font-size:20px;
color:#666;
}

.seal{
position:absolute;
left:50%;
top:80px;
transform:translateX(-50%);
width:70px;
height:70px;
background:#b48b4d;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
color:white;
z-index:4;
transition:.5s;
}

.envelope.open .flap{
transform:rotateX(180deg);
}

.envelope.open .letter{
transform:translateY(-170px);
}

.envelope.open .seal{
opacity:0;
}

.info{
margin-top:60px;
}

.info h2{
font-size:34px;
color:#9d773d;
}

.info p{
font-size:22px;
margin:10px 0;
}

#count{
font-size:28px;
font-weight:bold;
margin:20px 0;
}

.btn{
display:inline-block;
padding:15px 35px;
background:#b48b4d;
color:white;
text-decoration:none;
border-radius:40px;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<div class="envelope" onclick="abrir()">

<div class="base"></div>

<div class="flap"></div>

<div class="letter">
<h1>Wesley & Valéria</h1>
<p>19 de setembro de 2026</p>
</div>

<div class="seal">❤️</div>

</div>

<div class="info">
<h2>Nosso Casamento</h2>

<p>19/09/2026 • 17h</p>

<p>Rua Tereza Soares, 115<br>Parque Genibaú</p>

<div id="count"></div>

<a class="btn" href="https://link.mercadopago.com.br/wesleyevaleria" target="_blank">
Lista de Presentes
</a>

</div>

</div>

<script>

function abrir(){
document.querySelector(".envelope").classList.toggle("open");
}

const data=new Date("2026-09-19T17:00:00");

function atualizar(){

const agora=new Date();

const d=data-agora;

if(d<=0){
document.getElementById("count").innerHTML="Chegou o grande dia! ❤️";
return;
}

let dias=Math.floor(d/86400000);
let horas=Math.floor((d%86400000)/3600000);
let minutos=Math.floor((d%3600000)/60000);
let segundos=Math.floor((d%60000)/1000);

document.getElementById("count").innerHTML=
${dias} dias ${horas}h ${minutos}m ${segundos}s;

}

setInterval(atualizar,1000);

atualizar();

</script>

</body>
</html>
